name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-routing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Focused routing tests
        run: |
          go test -timeout 30s \
            ./sdk/api/handlers \
            ./internal/config \
            ./internal/api \
            ./internal/api/handlers/management \
            ./sdk/cliproxy/auth \
            ./sdk/cliproxy \
            ./internal/runtime/executor \
            -run 'TestSmart|TestRouting|TestAccountRouting|Test.*AutoRout|Test.*Reconcile|TestProbe|TestRefreshAuthCredential|Test.*LeastPressure|Test.*OpenAICompatRetryAfter|TestNewOpenAICompatStatusError' \
            -count=1

      - name: Vet changed routing packages
        run: |
          go vet \
            ./sdk/api/handlers \
            ./sdk/cliproxy/auth \
            ./sdk/cliproxy/executor \
            ./sdk/auth \
            ./sdk/cliproxy \
            ./internal/config \
            ./internal/api \
            ./internal/api/handlers/management \
            ./internal/runtime/executor \
            ./internal/watcher/synthesizer

  focused-routing-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused routing race tests
        run: |
          go test -timeout 45s -race \
            ./sdk/api/handlers \
            ./internal/api/handlers/management \
            ./sdk/cliproxy/auth \
            ./internal/runtime/executor \
            -run 'TestSmart|TestRouting|TestAccountRouting|Test.*Reconcile|TestProbe|TestRefreshAuthCredential|Test.*LeastPressure|Test.*OpenAICompatRetryAfter|TestNewOpenAICompatStatusError' \
            -count=1

  active-fault-fixture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 jq util-linux
          id crsproxy >/dev/null 2>&1 || sudo useradd --system --no-create-home crsproxy
          test "$(uname -m)" = aarch64
          for command in unshare ip setpriv python3 curl jq sha256sum awk; do
            command -v "$command" >/dev/null
          done
          test -x tools/smart-router/verify_active_fault_fixture.sh
          test -x tools/smart-router/verify_active_fault_fixture_inside.sh
          python3 -m py_compile tools/smart-router/verify_production_soak.py
      - name: Build and run loopback-only active fault fixture
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o test-output ./cmd/server
          sha256=$(sha256sum test-output | awk '{print $1}')
          sudo timeout 75s tools/smart-router/verify_active_fault_fixture.sh "$PWD/test-output" "$sha256"

  linux-arm64-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build Linux arm64 server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l internal sdk cmd)"
          git diff --check

  account-reconciler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify reconciler and systemd units
        run: |
          python -m compileall -q tools/account-reconciler/reconciler.py tools/account-reconciler/stage_candidate.py tools/account-reconciler/tests
          python -m py_compile tools/smart-router/verify_production_soak.py
          python -m py_compile tools/auto-router/render_config.py
          python -m unittest discover -s tools/account-reconciler/tests -q
          python -m unittest discover -s tools/smart-router/tests -q
          python -m unittest discover -s tools/auto-router/tests -q
          systemd-analyze verify \
            tools/account-reconciler/systemd/cliproxy-account-reconciler.service \
            tools/account-reconciler/systemd/cliproxy-account-reconciler.timer \
            tools/auto-router/systemd/cliproxy-auto-router.service \
            tools/smart-router/systemd/cliproxy-smart-router-soak.service \
            tools/smart-router/systemd/cliproxy-smart-router-soak.timer

      - name: Scan changed files for credential-shaped material
        run: |
          pattern='(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|Bearer [A-Za-z0-9._-]{20,})'
          if git diff --no-ext-diff "${{ github.event.pull_request.base.sha }}"...HEAD | grep -En "$pattern"; then
            exit 1
          fi
